<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Organizer</title>
</head>
<body>
    <div id="sidebar">
        <h3>Saved Messages</h3>
        <p style="font-size: 12px; color: #666;">Избранное и архивы</p>
    </div>
    
    <div id="chat-area">
        <div id="search-container">
            <div class="controls-row">
                <input type="text" id="search-input" placeholder="Поиск по истории..." />
                <button id="geo-btn">🗺️ Геолокация</button>
            </div>
        </div>

        <div id="messages"></div>
        
        <div id="input-area">
            <div id="file-drop-zone">
                Перетащите файл сюда или кликните для загрузки
                <input type="file" id="file-input" style="display: none"/>
            </div>
            
            <div class="input-row">
                <input type="text" id="message-input" placeholder="Напишите сообщение..." />
                <button id="send-btn">Отправить</button>
            </div>
        </div>
    </div>
</body>
</html>
